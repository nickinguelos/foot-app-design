<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football App — index des maquettes</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F4F2EC;color:#1E1E24;padding:24px 14px 60px}
main{max-width:720px;margin:0 auto}
h1{font-size:22px}
.sub{color:#5A5A66;font-size:14px;margin:6px 0 18px}
.warn{background:#fff;border:1px solid #D9D5C9;border-left:4px solid #1E1E24;border-radius:10px;padding:10px 12px;font-size:13px;color:#44444F;margin-bottom:18px}
.card{display:block;background:#fff;border:1px solid #D9D5C9;border-radius:14px;padding:14px;margin-bottom:12px;color:inherit;text-decoration:none}
.card:focus-visible,.card:hover{border-color:#1E1E24}
.card h2{font-size:17px}
.meta{font-size:12px;color:#6A6A76;margin:2px 0 8px}
.card p{font-size:14px;color:#33333D}
.sw{display:flex;gap:6px;margin-top:10px}
.sw i{width:28px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.15)}
.go{display:inline-block;margin-top:10px;font-size:14px;font-weight:700}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#6A6A76;margin:26px 0 8px}
.arch a{font-size:14px}
</style>
</head>
<body>
<main>
<h1>Football App — maquettes</h1>
<p class="sub" id="upd">Index des designs</p>
<div class="warn" id="note">Chargement…</div>
<div id="list"></div>
<h3>Archive</h3>
<div class="arch" id="arch"></div>
</main>
<script>
fetch('designs.json').then(r=>r.json()).then(d=>{
 document.getElementById('upd').textContent='Mis à jour le '+d.updated+' · '+d.designs.length+' designs';
 document.getElementById('note').textContent=d.note;
 document.getElementById('list').innerHTML=d.designs.map(x=>'<a class="card" href="'+x.path+'"><h2>'+x.title+'</h2><div class="meta">'+x.status+' · '+x.date+' · '+x.author+'</div><p>'+x.summary+'</p><div class="sw">'+x.palette.map(c=>'<i style="background:'+c+'"></i>').join('')+'</div><span class="go">Ouvrir →</span></a>').join('');
 document.getElementById('arch').innerHTML=d.archive.map(x=>'<a href="'+x.path+'">'+x.title+'</a> <span class="meta">'+x.date+' · '+x.author+'</span>').join('<br>');
}).catch(e=>{document.getElementById('note').textContent='Impossible de charger designs.json : '+e;});
</script>
</body>
</html>
