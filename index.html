<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6e9e9">
  <title>Hello World — Neumorphism</title>
  <style>
    :root {
      color-scheme: light;
      --surface: #f6e9e9;
      --surface-deep: #f0dede;
      --orange: #ff873d;
      --orange-dark: #e96726;
      --fuchsia: #e83f91;
      --ink: #553c4d;
      --muted: #967d8c;
      --shadow-light: rgba(255,255,255,.92);
      --shadow-dark: rgba(190,150,164,.42);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 18%, rgba(255,135,61,.16), transparent 28rem),
        radial-gradient(circle at 88% 82%, rgba(232,63,145,.14), transparent 30rem),
        var(--surface);
    }
    .shell { width: min(100%, 760px); text-align: center; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 10px 16px; border-radius: 999px;
      background: var(--surface);
      box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
      color: var(--muted); font-size: 11px; font-weight: 800;
      letter-spacing: .2em; text-transform: uppercase;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fuchsia); box-shadow: 0 0 0 4px rgba(232,63,145,.12); }
    .card {
      position: relative; overflow: hidden;
      margin-top: 34px; padding: clamp(34px, 7vw, 68px) 24px;
      border: 1px solid rgba(255,255,255,.6); border-radius: 34px;
      background: linear-gradient(145deg, #faeeee, #f1e2e4);
      box-shadow: 18px 18px 38px var(--shadow-dark), -18px -18px 38px var(--shadow-light);
    }
    .orb {
      position: absolute; width: 180px; height: 180px; border-radius: 50%;
      filter: blur(1px); opacity: .12; pointer-events: none;
    }
    .orb.one { top: -100px; left: -55px; background: var(--orange); }
    .orb.two { right: -90px; bottom: -110px; background: var(--fuchsia); width: 240px; height: 240px; }
    .mark {
      width: 74px; height: 74px; margin: 0 auto 28px; display: grid; place-items: center;
      border-radius: 24px; color: white; font-size: 30px; font-weight: 900;
      background: linear-gradient(135deg, var(--orange), var(--fuchsia));
      box-shadow: 8px 8px 18px rgba(202,104,115,.28), -5px -5px 14px rgba(255,255,255,.85);
    }
    h1 {
      margin: 0; font-size: clamp(42px, 9vw, 76px); line-height: 1.02;
      letter-spacing: -.065em; font-weight: 850;
    }
    h1 span {
      color: transparent; background: linear-gradient(100deg, var(--orange-dark), var(--fuchsia));
      -webkit-background-clip: text; background-clip: text;
    }
    .subtitle { max-width: 430px; margin: 20px auto 0; color: var(--muted); font-size: 15px; line-height: 1.75; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
    .button {
      min-width: 148px; padding: 15px 22px; border: 0; border-radius: 16px;
      font: inherit; font-size: 13px; font-weight: 800; cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .button:hover { transform: translateY(-2px); }
    .button.primary {
      color: white; background: linear-gradient(110deg, var(--orange), var(--fuchsia));
      box-shadow: 7px 7px 16px rgba(204,103,119,.3), -5px -5px 13px rgba(255,255,255,.85);
    }
    .button.secondary {
      color: var(--muted); background: var(--surface);
      box-shadow: 7px 7px 15px var(--shadow-dark), -7px -7px 15px var(--shadow-light);
    }
    .status { min-height: 22px; margin-top: 24px; color: var(--fuchsia); font-size: 12px; font-weight: 700; }
    footer { margin-top: 25px; color: #ad96a3; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow"><span class="dot"></span> Mini design experiment</div>
    <section class="card" aria-labelledby="title">
      <span class="orb one"></span><span class="orb two"></span>
      <div class="mark" aria-hidden="true">✦</div>
      <h1 id="title">Hello <span>World.</span></h1>
      <p class="subtitle">Une première maquette HTML en neumorphism, avec une palette chaleureuse orange et fuchsia. Simple, douce et responsive.</p>
      <div class="actions">
        <button class="button primary" id="helloButton" type="button">Say hello <span aria-hidden="true">↗</span></button>
        <button class="button secondary" id="resetButton" type="button">Reset</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
    <footer>HTML · CSS · JavaScript · Neumorphism</footer>
  </main>
  <script>
    const status = document.querySelector("#status");
    document.querySelector("#helloButton").addEventListener("click", () => {
      status.textContent = "Hello Nick — nice to see you! ✨";
    });
    document.querySelector("#resetButton").addEventListener("click", () => {
      status.textContent = "";
    });
  </script>
</body>
</html>
